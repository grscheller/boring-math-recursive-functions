[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "boring-math-recursive-functions"
version = "1.1.0"
description = "Recursive functions package."
readme = "README.md"
requires-python = ">=3.14"  # floor: PEP 649/749 deferred annotations — class-level self-reference NameErrors on <3.14
authors = [
  { name = "Geoffrey R. Scheller", email = "geoffrey@scheller.com" },
]
keywords = [
  "ackermann",
  "fibonacci",
  "recursive",
  "recursive functions",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Education",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  "pythonic-fp-iterables>=5.1.4",
]

[project.scripts]
ackermann_list = "boring_math.recursive_functions.cli.ackermann_cli:ackermann_list_cli"
fibonacci = "boring_math.recursive_functions.cli.fibonacci_cli:fibonacci"

[project.urls]
Changelog = "https://github.com/grscheller/boring-math-recursive-functions/blob/main/CHANGELOG.md"
Documentation ="https://grscheller.github.io/boring-math-recursive-functions/release/html/"
Homepage = "https://grscheller.github.io/boring-math/"
Source = "https://github.com/grscheller/boring-math-recursive-functions"

[dependency-groups]
docs = [
  "furo>=2025.12.19",
  "sphinx>=9.1",
]
test = [
  "pytest>=8.4.1",
]

[tool.flit.module]
name = "boring_math.recursive_functions"

[tool.flit.sdist]
exclude = [
  "docs/",
  "tests/",
  "**/.mypy_cache/",
  "**/.ruff_cache/",
  "**/.pytest_cache/",
  "**/__pycache__/",
  "**/.dmypy.json",
]

[tool.mypy]
explicit_package_bases = true
local_partial_types = true
namespace_packages = true
strict = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
strict_equality = false

[tool.pytest]
addopts = ["-ra"]
consider_namespace_packages = true
testpaths = ["tests/"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
ignore = ["RUF022", "E741"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "E731",
  "C901",
]

[tool.ruff.format]
quote-style = "single"
docstring-code-line-length = 72
